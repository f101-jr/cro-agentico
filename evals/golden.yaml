# Set dorado. Se ejecuta contra fixtures, sin red.
#
# Tres familias:
#   causal  — la respuesta debe cruzar fuentes antes de afirmar una causa
#   refusal — la respuesta debe decir "no tengo ese dato" sin inventarlo
#   factual — la respuesta debe dar la cifra exacta y poco más
#
# La familia `refusal` es la que no se puede eliminar: un sistema que nunca dice
# "no tengo ese dato" está inventando.

# --------------------------------------------------------------------- causal
- id: mobile_cr_drop_cause
  family: causal
  question: "La conversión en móvil ha caído. ¿Por qué?"
  must_call_tools: [get_funnel_metrics, get_orders_summary]
  must_cite_sources: [ga4, shopify]
  expect_contains: ["checkout", "AOV"]
  expect_causal_claim: true
  forbid_figures_not_in_tools: true

- id: mobile_cr_drop_week
  family: causal
  question: "¿Por qué ha bajado la conversión en móvil esta semana?"
  must_call_tools: [get_conversion_rate, compare_windows, get_support_signal]
  must_cite_sources: [ga4, shopify, support]
  expect_contains: ["checkout", "envío"]
  expect_causal_claim: true
  forbid_figures_not_in_tools: true

- id: desktop_no_cause_to_explain
