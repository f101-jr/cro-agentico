[project]
name = "cro-agentico"
version = "0.1.0"
description = "Backend de CRO agéntico: responde preguntas de negocio cruzando GA4, Shopify y soporte mediante un LLM que decide qué consultar."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
vertex = ["anthropic[vertex]>=0.40"]
ga4 = ["google-analytics-data>=0.18", "google-auth>=2.35"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "connectors", "semantic", "storage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
